<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giải Mã Ô Chữ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noticia+Text:wght@400;700&display=swap">
<style>
/* Layout: one fixed 16:9 stage (1600x900) scaled to the screen, like a slide. Board left, wheel right, keyword band at the bottom. */
:root{
  --red:#c8102e; --red-deep:#8f0a1f; --cream:#fdf6e6; --cream-2:#f4e6c8;
  --ink:#3a0a10; --gold:#f6c343; --key:#e3a1a6; --key-hot:#d9737b; --muted:#9a8b80;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Noticia Text",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--red-deep);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#fit{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{width:1600px;height:900px;position:relative;flex:none;background:var(--cream);overflow:hidden;
  transform-origin:center center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
/* subtle drum pattern like the slide background */
#stage::before{content:"";position:absolute;right:-140px;top:120px;width:760px;height:760px;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(200,16,46,.05) 0 2px,transparent 2px 26px);pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

/* header */
.hdr{position:absolute;left:0;right:0;top:34px;height:78px;display:flex;align-items:center}
.flag{width:150px;height:78px;background:var(--red);clip-path:polygon(0 0,100% 0,82% 50%,100% 100%,0 100%);display:grid;place-items:center;padding-right:24px}
.flag svg{width:46px;height:46px}
.band{flex:1;height:58px;background:var(--red);margin-left:-8px;display:flex;align-items:center;justify-content:space-between;padding:0 48px 0 34px;
  border-bottom:6px solid var(--red-deep)}
.band h1{margin:0;font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:2px;color:var(--cream);text-transform:uppercase}
.band small{font-family:var(--body);font-size:17px;letter-spacing:1.5px;color:var(--cream);opacity:.9;text-transform:uppercase}

/* board */
.board{position:absolute;left:70px;top:150px;width:920px;height:610px}
.grid{display:grid;grid-template-columns:repeat(11,74px);grid-auto-rows:74px;gap:6px}
.cell{border:3px solid var(--ink);background:#fffdf8;display:grid;place-items:center;font-family:var(--body);font-weight:700;
  font-size:36px;color:var(--ink);position:relative;perspective:400px}
.cell.k{background:var(--key)}
.cell span{display:block;transform:rotateX(90deg);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.cell.on span{transform:none;opacity:1}
.cell.k.on{background:var(--key-hot)}
.cell.k.glow{animation:glow 1.2s ease-out}
.cell.dim span{color:var(--muted)}
.cell.lock::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:36px;color:var(--red-deep);background:var(--key)}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(246,195,67,1)}100%{box-shadow:0 0 0 22px rgba(246,195,67,0)}}
.num{font-family:var(--display);font-weight:800;font-size:34px;color:var(--ink);display:grid;place-items:center;border-radius:50%;
  width:56px;height:56px;justify-self:end;align-self:center;margin-right:2px;transition:background .2s,color .2s,transform .2s}
.num:hover{background:var(--gold);transform:scale(1.08)}
.num.done{color:var(--muted);text-decoration:line-through;cursor:default}
.num.done:hover{background:none;transform:none}
.num.asking{background:var(--red);color:var(--cream);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.hint{position:absolute;left:70px;top:752px;font-size:18px;color:var(--ink);opacity:.75}

/* wheel */
.wheel-wrap{position:absolute;right:70px;top:150px;width:470px;display:flex;flex-direction:column;align-items:center;gap:14px}
.wheel{position:relative;width:440px;height:440px}
.wheel svg.disc{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 18px rgba(80,0,10,.28))}
.wheel svg.pointer{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:54px;height:64px;z-index:2;transform-origin:50% 10%;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.wheel svg.pointer.tick{animation:tick .12s}
@keyframes tick{50%{transform:translateX(-50%) rotate(-14deg)}}
.spin-btn{position:absolute;left:50%;top:50%;width:132px;height:132px;transform:translate(-50%,-50%);border-radius:50%;
  background:var(--red);color:var(--cream);font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:2px;
  border:7px solid var(--gold);box-shadow:0 6px 0 var(--red-deep);transition:transform .15s}
.spin-btn:hover{transform:translate(-50%,-50%) scale(1.06)}
.spin-btn:disabled{filter:saturate(.4);cursor:default;transform:translate(-50%,-50%)}
.progress{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:1px;color:var(--ink)}
.progress b{color:var(--red)}

/* keyword band */
.kw{position:absolute;left:0;right:0;bottom:0;height:120px;background:var(--red);display:flex;align-items:center;gap:28px;padding:0 70px;border-top:6px solid var(--gold)}
.kw-label{font-family:var(--display);font-weight:800;font-size:34px;color:var(--gold);letter-spacing:2px;line-height:1}
.kw-label small{display:block;font-family:var(--body);font-weight:400;font-size:16px;letter-spacing:.5px;color:var(--cream);margin-top:6px}
.slots{display:flex;gap:10px}
.slot{width:70px;height:78px;border-radius:6px;background:rgba(255,255,255,.12);border:3px dashed rgba(253,246,230,.55);display:grid;place-items:center;
  font-family:var(--body);font-weight:700;font-size:42px;color:var(--red-deep)}
.slot.gap{width:22px;background:none;border:0}
.slot.on{background:var(--cream);border:3px solid var(--gold);animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg)}100%{transform:none}}
.guess-btn{margin-left:auto;background:var(--gold);color:var(--red-deep);font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:1.5px;
  padding:14px 34px;border-radius:999px;box-shadow:0 5px 0 #b88a18;transition:transform .15s}
.guess-btn:hover{transform:translateY(-2px)}
.guess-btn.nudge{animation:pulse 1.1s infinite}

/* tools */
.tools{position:absolute;right:18px;top:122px;display:flex;gap:6px;z-index:5}
.tools button{font-size:15px;padding:6px 12px;border-radius:999px;background:rgba(58,10,16,.07);color:var(--ink)}
.tools button:hover{background:rgba(58,10,16,.15)}

/* modal */
.veil{position:absolute;inset:0;background:rgba(58,10,16,.62);display:grid;place-items:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.show{opacity:1;pointer-events:auto}
.card{width:1180px;max-height:800px;background:var(--cream);border-top:14px solid var(--red);padding:38px 56px 40px;position:relative;
  transform:translateY(30px) scale(.97);transition:transform .3s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;gap:22px}
.veil.show .card{transform:none}
.tag{font-family:var(--display);font-weight:800;font-size:30px;color:var(--red);letter-spacing:2px;text-transform:uppercase}
.qtext{font-family:var(--body);font-weight:700;font-size:38px;line-height:1.35;margin:0;text-wrap:balance;max-width:960px}
.clue{display:flex;align-items:center;gap:26px;min-height:0}
.clue:empty{display:none}
.anag{display:flex;gap:12px}
.anag i{font-style:normal;width:76px;height:76px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-weight:700;font-size:40px}
.rebus{display:flex;align-items:center;gap:30px;font-family:var(--display);font-weight:800;font-size:64px;color:var(--red)}
.rebus figure{margin:0;width:190px;height:150px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;position:relative}
.rebus figure svg{width:120px;height:120px}
.rebus figcaption{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-family:var(--body);font-weight:400;font-size:16px;color:var(--ink)}
.ans{display:flex;gap:8px;flex-wrap:wrap}
.ans i{font-style:normal;width:74px;height:74px;border:3px solid var(--ink);background:#fffdf8;display:grid;place-items:center;font-weight:700;font-size:38px}
.ans i.k{background:var(--key)}
.ans i span{transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.ans i.on span{transform:none}
.exp{font-size:22px;line-height:1.5;margin:0;max-width:1000px;border-left:6px solid var(--gold);padding-left:18px}
.row-btns{display:flex;gap:16px;align-items:center;margin-top:6px}
.b{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:1px;padding:14px 32px;border-radius:999px;transition:transform .15s}
.b:hover{transform:translateY(-2px)}
.b.main{background:var(--red);color:var(--cream);box-shadow:0 5px 0 var(--red-deep)}
.b.ok{background:#2f7d3a;color:#fff;box-shadow:0 5px 0 #1c5124}
.b.no{background:var(--ink);color:var(--cream);box-shadow:0 5px 0 #1d0508}
.b.ghost{color:var(--ink);text-decoration:underline;font-size:24px;padding:14px 10px}
.timer{position:absolute;right:46px;top:30px;width:110px;height:110px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;color:var(--red)}
.timer.low b{animation:pulse .5s infinite}
.timer.out b{font-size:24px;text-align:center;line-height:1}

/* final banner */
.win{position:absolute;left:0;right:0;top:150px;bottom:120px;display:grid;place-items:center;z-index:15;pointer-events:none;opacity:0;transition:opacity .4s}
.win.show{opacity:1;pointer-events:auto}
.win-box{background:var(--red);color:var(--cream);text-align:center;padding:40px 80px 46px;border:8px solid var(--gold);box-shadow:0 20px 50px rgba(58,10,16,.45)}
.win-box p{margin:0;font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.win-box h2{margin:6px 0 22px;font-family:var(--body);font-weight:700;font-size:128px;letter-spacing:10px;line-height:1}
.win-box .row-btns{justify-content:center}
.win-box .b.ghost{color:var(--cream)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="fit"><div id="stage">
  <div class="hdr">
    <div class="flag"><svg viewBox="0 0 24 24"><path fill="#f6c343" d="M12 1.8l2.6 7.2h7.6l-6.1 4.5 2.3 7.3L12 16.4l-6.4 4.4 2.3-7.3L1.8 9h7.6z"/></svg></div>
    <div class="band"><h1>Giải mã ô chữ</h1><small>Bộ môn Chủ nghĩa xã hội khoa học</small></div>
  </div>
  <div class="tools">
    <button id="tSound" type="button">Âm thanh: bật</button>
    <button id="tFull" type="button">Toàn màn hình</button>
    <button id="tReset" type="button">Chơi lại</button>
  </div>

  <div class="board"><div class="grid" id="grid"></div></div>
  <div class="hint">Quay vòng quay hoặc bấm vào số câu để chọn câu hỏi.</div>

  <div class="wheel-wrap">
    <div class="wheel">
      <svg class="pointer" id="pointer" viewBox="0 0 54 64"><path d="M27 62 4 14a24 24 0 1 1 46 0z" fill="#3a0a10"/><circle cx="27" cy="22" r="9" fill="#f6c343"/></svg>
      <svg class="disc" viewBox="-210 -210 420 420"><g id="wheelRot"></g></svg>
      <button class="spin-btn" id="spin" type="button">QUAY</button>
    </div>
    <div class="progress" id="progress">Đã mở <b>0</b>/7 hàng ngang</div>
  </div>

  <div class="kw">
    <div class="kw-label">TỪ KHOÁ<small>Hàng dọc · 7 chữ cái</small></div>
    <div class="slots" id="slots"></div>
    <button class="guess-btn" id="guess" type="button">ĐOÁN TỪ KHOÁ</button>
  </div>

  <div class="win" id="win"><div class="win-box">
    <p>Từ khoá hàng dọc</p><h2>GIA ĐÌNH</h2>
    <div class="row-btns"><button class="b ok" id="openAll" type="button">Mở hết ô chữ</button><button class="b ghost" id="closeWin" type="button">Đóng</button></div>
  </div></div>

  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  <canvas id="fx" width="1600" height="900"></canvas>
</div></div>

<script>
(()=>{
const QS=[
 {ans:"GIÁODỤC",key:0,q:"Cùng với chức năng nuôi dưỡng, gia đình còn có trách nhiệm dạy dỗ con cái trở thành người có ích cho cộng đồng. Chức năng này được gọi là chức năng nuôi dưỡng và ...?",
  exp:"Theo tiểu mục b (Chức năng nuôi dưỡng, giáo dục) thuộc mục 7.1.3: “Gia đình có trách nhiệm nuôi dưỡng, dạy dỗ con cái trở thành người có ích cho gia đình, cộng đồng và xã hội”."},
 {ans:"KINHTẾ",key:1,q:"Sắp xếp lại các chữ cái dưới đây. Đây là từ gì?",clue:"anag",letters:["T","Ế","N","K","H","I"],
  exp:"Theo tiểu mục c thuộc mục 7.1.3, chức năng kinh tế: gia đình tham gia trực tiếp vào quá trình sản xuất và tái sản xuất ra tư liệu sản xuất và tư liệu tiêu dùng; là đơn vị duy nhất tham gia vào quá trình tái sản xuất ra sức lao động cho xã hội."},
 {ans:"HAI",key:1,q:"Quy mô gia đình hiện nay có xu hướng thu nhỏ hơn, thường có mấy thế hệ cùng sống chung?",
  exp:"Theo mục 7.3.1.a, quy mô gia đình hiện nay có xu hướng thu nhỏ hơn, thường chỉ có hai thế hệ cùng sống chung; gia đình hạt nhân đang trở nên rất phổ biến, thay thế cho kiểu gia đình truyền thống."},
 {ans:"ĐỘCHẠI",key:0,q:"Nhìn hình đoán chữ. Đây là từ gì?",clue:"rebus",pics:["skull","hi"],
  exp:"Tại mục 7.3.2 (Tác động của khoa học và công nghệ), mặt trái của công nghệ số đặt ra thách thức lớn trong công tác quản lý, kiểm soát các luồng thông tin trái chiều, độc hại trên không gian mạng."},
 {ans:"TÌNHCẢM",key:1,q:"Nhu cầu thỏa mãn tâm lý – ... đang tăng lên, do đó gia đình Việt Nam hiện nay có xu hướng chuyển đổi từ chủ yếu là đơn vị kinh tế sang chủ yếu là đơn vị này?",
  exp:"Theo mục 7.3.1.b (Biến đổi chức năng thỏa mãn nhu cầu tâm lý, duy trì tình cảm): do nhu cầu tình cảm tăng lên, gia đình đang chuyển đổi từ đơn vị kinh tế sang đơn vị tình cảm."},
 {ans:"HÔNNHÂN",key:2,q:"Cơ sở hình thành gia đình dựa trên 3 mối quan hệ chính: quan hệ huyết thống, quan hệ nuôi dưỡng và quan hệ ...?",
  exp:"Mục 7.1.1 (Khái niệm gia đình) định nghĩa gia đình được hình thành và duy trì chủ yếu dựa trên cơ sở hôn nhân, quan hệ huyết thống và quan hệ nuôi dưỡng."},
 {ans:"VĂNHÓA",key:3,q:"Nhìn hình đoán chữ. Đây là từ gì?",clue:"rebus",pics:["essay","chem"],
  exp:"Mục 7.3.3 nêu các phương hướng cơ bản trong thời kỳ quá độ lên chủ nghĩa xã hội, trong đó nhấn mạnh: “Tiếp tục phát triển và nâng cao chất lượng phong trào xây dựng gia đình văn hóa”."}
];
const KEY="GIAĐÌNH", KC=3, N=QS.length, TIME=30;
const $=s=>document.querySelector(s);
const st={rows:Array(N).fill("hidden"),kw:false,spinning:false,modal:null,rot:0,sound:true};

/* ---------- fit stage ---------- */
const stage=$("#stage");
function fit(){const vw=document.documentElement.clientWidth||innerWidth,vh=Math.min(innerHeight,(window.visualViewport&&visualViewport.height)||innerHeight);
  const s=Math.min(vw/1600,vh/900)*.98;stage.style.transform=`scale(${s})`;}
addEventListener("resize",fit);fit();

/* ---------- sound ---------- */
let ac=null;
function tone(f,d=.08,type="square",v=.06,when=0){
  if(!st.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const sfx={
  tick:()=>tone(1400,.03,"square",.03),
  ding:()=>{tone(784,.18,"triangle",.12);tone(1175,.3,"triangle",.12,.12)},
  buzz:()=>{tone(150,.35,"sawtooth",.08)},
  flip:()=>tone(620,.05,"triangle",.06),
  fan:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,"triangle",.12,i*.13)),
  beep:()=>tone(990,.06,"square",.05)
};

/* ---------- board ---------- */
const grid=$("#grid"); const cells=[]; const nums=[];
QS.forEach((q,r)=>{
  const start=KC-q.key; const letters=[...q.ans];
  const n=document.createElement("button");n.type="button";n.className="num";n.textContent=r+1;
  n.style.gridRow=r+1;n.style.gridColumn=start+1;n.setAttribute("aria-label","Mở câu "+(r+1));
  n.onclick=()=>{if(st.rows[r]==="hidden"&&!st.spinning&&!st.modal)openQ(r)};
  grid.appendChild(n);nums.push(n);
  cells[r]=letters.map((ch,j)=>{const c=document.createElement("div");c.className="cell"+(j===q.key?" k":"");
    c.style.gridRow=r+1;c.style.gridColumn=start+2+j;c.innerHTML=`<span>${ch}</span>`;grid.appendChild(c);return c;});
});
const slots=$("#slots"); const slotEls=[];
[...KEY].forEach((ch,i)=>{if(i===3){const g=document.createElement("div");g.className="slot gap";slots.appendChild(g);}
  const s=document.createElement("div");s.className="slot";s.dataset.ch=ch;slots.appendChild(s);slotEls.push(s);});

/* ---------- wheel ---------- */
const W=$("#wheelRot"),SEG=360/N,R=200;
const pt=(a,r)=>[r*Math.sin(a*Math.PI/180),-r*Math.cos(a*Math.PI/180)];
const fills=["#c8102e","#fdf6e6","#9e0b23","#f6c343","#c8102e","#fdf6e6","#9e0b23"];
const inks =["#fdf6e6","#c8102e","#f6c343","#8f0a1f","#fdf6e6","#c8102e","#f6c343"];
function drawWheel(){
  let h=`<circle r="${R+8}" fill="#3a0a10"/>`;
  QS.forEach((q,i)=>{const a0=i*SEG,a1=(i+1)*SEG,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[tx,ty]=pt(a0+SEG/2,R*.66);
    const done=st.rows[i]!=="hidden";
    h+=`<path d="M0 0L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${done?"#d8cfc3":fills[i]}" stroke="#3a0a10" stroke-width="3"/>`;
    h+=`<text x="${tx}" y="${ty}" transform="rotate(${a0+SEG/2} ${tx} ${ty})" text-anchor="middle" dominant-baseline="central"
      font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="${done?34:54}" fill="${done?"#9a8b80":inks[i]}">${done?"✓":i+1}</text>`;
  });
  for(let i=0;i<N;i++){const [x,y]=pt(i*SEG,R+1);h+=`<circle cx="${x}" cy="${y}" r="6" fill="#f6c343"/>`;}
  W.innerHTML=h;
}
const setRot=r=>W.setAttribute("transform",`rotate(${r})`);
drawWheel();setRot(0);

function spin(){
  if(st.spinning||st.modal)return;
  const left=st.rows.map((s,i)=>s==="hidden"?i:-1).filter(i=>i>=0);
  if(!left.length){$("#guess").classList.add("nudge");return;}
  const pick=left[Math.floor(Math.random()*left.length)];
  const c=pick*SEG+SEG/2, jitter=(Math.random()-.5)*(SEG-12);
  const from=st.rot, base=((from%360)+360)%360;
  const to=from+360*5+((360-c-jitter-base)%360+360)%360;
  st.spinning=true;$("#spin").disabled=true;
  const dur=4200,t0=performance.now();let lastSeg=null;
  const ease=t=>1-Math.pow(1-t,4);
  (function f(now){
    const t=Math.min(1,(now-t0)/dur),r=from+(to-from)*ease(t);setRot(r);
    const seg=Math.floor((((-r)%360+360)%360)/SEG);
    if(seg!==lastSeg){if(lastSeg!==null){sfx.tick();const p=$("#pointer");p.classList.remove("tick");void p.offsetWidth;p.classList.add("tick");}lastSeg=seg;}
    if(t<1)requestAnimationFrame(f);
    else{st.rot=to;st.spinning=false;$("#spin").disabled=false;sfx.beep();setTimeout(()=>openQ(pick),550);}
  })(t0);
}
$("#spin").onclick=spin;

/* ---------- question modal ---------- */
const veil=$("#veil"),card=$("#card");let timerId=null;
const PICS={
 skull:`<svg viewBox="0 0 120 120"><rect x="22" y="22" width="76" height="76" transform="rotate(45 60 60)" fill="#fff" stroke="#c8102e" stroke-width="8"/>
  <circle cx="60" cy="52" r="20" fill="#3a0a10"/><rect x="48" y="62" width="24" height="14" rx="3" fill="#3a0a10"/>
  <circle cx="52" cy="52" r="5" fill="#fff"/><circle cx="68" cy="52" r="5" fill="#fff"/>
  <path d="M34 82 86 94M86 82 34 94" stroke="#3a0a10" stroke-width="7" stroke-linecap="round"/></svg>`,
 hi:`<svg viewBox="0 0 120 120"><g fill="#f3d1b0" stroke="#3a0a10" stroke-width="3">
  <rect x="34" y="20" width="12" height="46" rx="6"/><rect x="48" y="12" width="12" height="54" rx="6"/><rect x="62" y="16" width="12" height="50" rx="6"/>
  <rect x="76" y="26" width="11" height="42" rx="5.5"/><path d="M30 58q-14-10-8 2l14 22q8 18 26 18h6q22 0 22-26V58z"/></g>
  <text x="96" y="30" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="24" fill="#c8102e">HI!</text></svg>`,
 essay:`<svg viewBox="0 0 120 120"><rect x="24" y="10" width="72" height="100" fill="#fff" stroke="#3a0a10" stroke-width="4"/>
  <text x="60" y="30" text-anchor="middle" font-family="Noticia Text,serif" font-weight="700" font-size="12" fill="#3a0a10">BÀI VĂN</text>
  <g stroke="#9a8b80" stroke-width="3"><path d="M34 44h52M34 54h52M34 64h46M34 74h52M34 84h40M34 94h50"/></g></svg>`,
 chem:`<svg viewBox="0 0 120 120"><g fill="none" stroke="#2456a6" stroke-width="4"><path d="M44 18v30L22 96q-3 8 6 8h64q9 0 6-8L76 48V18M38 18h44"/></g>
  <path d="M33 78h54l9 18q2 6-5 6H29q-7 0-5-6z" fill="#7fb2ea"/>
  <text x="84" y="26" font-family="Noticia Text,serif" font-weight="700" font-size="18" fill="#2456a6">H₂O</text></svg>`
};
const CAPS={skull:"",hi:"",essay:"",chem:""};
function clueHtml(q){
  if(q.clue==="anag")return `<div class="anag">${q.letters.map(l=>`<i>${l}</i>`).join("")}</div>`;
  if(q.clue==="rebus")return `<div class="rebus"><figure>${PICS[q.pics[0]]}</figure>+<figure>${PICS[q.pics[1]]}</figure></div>`;
  return "";
}
function openQ(r){
  const q=QS[r],L=[...q.ans];st.modal={type:"q",r,phase:"ask"};st.rows[r]="asking";nums[r].classList.add("asking");
  card.innerHTML=`<div class="tag">Câu ${r+1} · ${L.length} chữ cái</div>
   <p class="qtext">${q.q}</p><div class="clue">${clueHtml(q)}</div>
   <div class="ans" id="ans">${L.map((ch,j)=>`<i class="${j===q.key?"k":""}"><span>${ch}</span></i>`).join("")}</div>
   <p class="exp" id="exp" hidden>${q.exp}</p>
   <div class="row-btns" id="btns"><button class="b main" id="bShow" type="button">Xem đáp án</button>
     <button class="b ghost" id="bBack" type="button">Chọn câu khác</button></div>
   <div class="timer" id="timer"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="#f4e6c8" stroke-width="10"/>
     <circle id="tArc" cx="55" cy="55" r="48" fill="none" stroke="#c8102e" stroke-width="10" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="0"/></svg><b id="tNum">${TIME}</b></div>`;
  veil.classList.add("show");
  $("#bShow").onclick=()=>reveal(r);$("#bBack").onclick=()=>closeQ(r,true);
  startTimer();setTimeout(()=>$("#bShow")?.focus(),50);
}
function startTimer(){
  clearInterval(timerId);let left=TIME;const arc=$("#tArc"),num=$("#tNum"),box=$("#timer");
  timerId=setInterval(()=>{left--;num.textContent=left;arc.style.strokeDashoffset=301.6*(1-left/TIME);
    if(left<=5&&left>0){box.classList.add("low");sfx.beep();}
    if(left<=0){clearInterval(timerId);box.classList.remove("low");box.classList.add("out");num.textContent="HẾT GIỜ";sfx.buzz();}
  },1000);
}
function reveal(r){
  clearInterval(timerId);st.modal.phase="shown";
  [...document.querySelectorAll("#ans i")].forEach((el,j)=>setTimeout(()=>{el.classList.add("on");sfx.flip();},j*110));
  $("#exp").hidden=false;
  $("#btns").innerHTML=`<button class="b ok" id="bOk" type="button">✓ Trả lời đúng</button><button class="b no" id="bNo" type="button">✗ Chưa đúng</button>
    <span style="font-size:18px;opacity:.7;margin-left:8px">Sai thì hàng vẫn mở, nhưng chữ hàng dọc bị khoá.</span>`;
  $("#bOk").onclick=()=>finish(r,true);$("#bNo").onclick=()=>finish(r,false);setTimeout(()=>$("#bOk")?.focus(),50);
}
function closeQ(r,back){
  clearInterval(timerId);veil.classList.remove("show");st.modal=null;nums[r].classList.remove("asking");
  if(back)st.rows[r]="hidden";
}
function finish(r,ok){
  closeQ(r,false);st.rows[r]=ok?"right":"wrong";nums[r].classList.add("done");drawWheel();
  const q=QS[r];
  cells[r].forEach((c,j)=>setTimeout(()=>{
    if(j===q.key&&!ok&&!st.kw){c.classList.add("lock");}
    else{c.classList.add("on");if(!ok&&j!==q.key)c.classList.add("dim");}
    sfx.flip();
    if(j===q.key&&ok){c.classList.add("glow");setTimeout(()=>fillSlot(r),250);}
  },250+j*120));
  setTimeout(()=>ok?sfx.ding():sfx.buzz(),250+[...q.ans].length*120);
  updProgress();
}
function fillSlot(i){const s=slotEls[i];if(s.classList.contains("on"))return;s.textContent=s.dataset.ch;s.classList.add("on");}
function updProgress(){
  const d=st.rows.filter(s=>s==="right"||s==="wrong").length;
  $("#progress").innerHTML=st.kw?`Từ khoá đã được giải!`:`Đã mở <b>${d}</b>/7 hàng ngang`;
  if(d===N&&!st.kw)$("#guess").classList.add("nudge");
}

/* ---------- keyword ---------- */
function openGuess(){
  if(st.spinning||st.modal||st.kw)return;
  st.modal={type:"kw"};
  const have=slotEls.filter(s=>s.classList.contains("on")).length;
  card.innerHTML=`<div class="tag">Đoán từ khoá hàng dọc</div>
   <p class="qtext">Từ khoá gồm 7 chữ cái, 2 tiếng. Đội đoán đúng từ khoá giành chiến thắng!</p>
   <div class="ans">${slotEls.map((s,i)=>`${i===3?'<b style="width:22px"></b>':""}<i class="k${s.classList.contains("on")?" on":""}"><span>${s.dataset.ch}</span></i>`).join("")}</div>
   <p style="margin:0;font-size:20px;opacity:.75">Đã lộ ${have}/7 chữ.</p>
   <div class="row-btns"><button class="b ok" id="kOk" type="button">✓ Đoán đúng – mở từ khoá</button>
   <button class="b no" id="kNo" type="button">✗ Chưa đúng – chơi tiếp</button></div>`;
  veil.classList.add("show");
  $("#kOk").onclick=solve;$("#kNo").onclick=()=>{veil.classList.remove("show");st.modal=null;sfx.buzz();};
  setTimeout(()=>$("#kOk")?.focus(),50);
}
function solve(){
  veil.classList.remove("show");st.modal=null;st.kw=true;$("#guess").classList.remove("nudge");$("#guess").disabled=true;
  slotEls.forEach((s,i)=>setTimeout(()=>{fillSlot(i);sfx.flip();},i*160));
  QS.forEach((q,r)=>setTimeout(()=>{const c=cells[r][q.key];c.classList.remove("lock");c.classList.add("on","glow");},r*160));
  setTimeout(()=>{sfx.fan();confetti();$("#win").classList.add("show");updProgress();},N*160+200);
}
$("#guess").onclick=openGuess;
$("#closeWin").onclick=()=>$("#win").classList.remove("show");
$("#openAll").onclick=()=>{$("#win").classList.remove("show");
  QS.forEach((q,r)=>{if(st.rows[r]==="hidden"){st.rows[r]="shown";nums[r].classList.add("done");
    cells[r].forEach((c,j)=>setTimeout(()=>{c.classList.add("on");sfx.flip();},r*90+j*70));}});drawWheel();};

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#fx"),cx=cv.getContext("2d"),cols=["#f6c343","#c8102e","#fdf6e6","#ffdd7a"];
  const P=Array.from({length:220},()=>({x:800+(Math.random()-.5)*300,y:420,vx:(Math.random()-.5)*26,vy:-Math.random()*22-6,
    s:Math.random()*10+6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*4)],star:Math.random()<.25}));
  const t0=performance.now();
  (function f(now){cx.clearRect(0,0,1600,900);P.forEach(p=>{p.vy+=.55;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.star){cx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5,rr=k%2?p.s*.45:p.s;cx.lineTo(Math.sin(a)*rr,-Math.cos(a)*rr);}cx.fill();}
    else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
    if(now-t0<4500)requestAnimationFrame(f);else cx.clearRect(0,0,1600,900);})(t0);
}

/* ---------- tools ---------- */
$("#tSound").onclick=e=>{st.sound=!st.sound;e.target.textContent="Âm thanh: "+(st.sound?"bật":"tắt");};
$("#tFull").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
let armed=null;
$("#tReset").onclick=e=>{
  if(!armed){e.target.textContent="Bấm lần nữa để chơi lại";armed=setTimeout(()=>{armed=null;e.target.textContent="Chơi lại";},3000);return;}
  clearTimeout(armed);armed=null;e.target.textContent="Chơi lại";reset();
};
function reset(){
  clearInterval(timerId);veil.classList.remove("show");$("#win").classList.remove("show");
  st.rows.fill("hidden");st.kw=false;st.modal=null;
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("on","dim","lock","glow"));
  nums.forEach(n=>n.classList.remove("done","asking"));
  slotEls.forEach(s=>{s.classList.remove("on");s.textContent="";});
  $("#guess").disabled=false;$("#guess").classList.remove("nudge");drawWheel();updProgress();
}

/* ---------- keyboard ---------- */
addEventListener("keydown",e=>{
  if(e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;
  const m=st.modal;
  if(e.key==="Escape"&&m){if(m.type==="q"&&m.phase==="ask")closeQ(m.r,true);else if(m.type==="kw"){veil.classList.remove("show");st.modal=null;}return;}
  if(m)return;
  if(e.key===" "){e.preventDefault();spin();}
  else if(/^[1-7]$/.test(e.key)){const r=+e.key-1;if(st.rows[r]==="hidden"&&!st.spinning)openQ(r);}
  else if(e.key==="k"||e.key==="K")openGuess();
  else if(e.key==="f"||e.key==="F")$("#tFull").click();
});
})();
</script>
</body>
</html>
